# SILENT HILL: DOWNPOUR / Nintendo Switch - 0.1.0 test (free, t.me/fspores)
# ReXGlue port; SDK masseffect-nx + prototype2-nx patch; native renderer from prototype2-nx (penettrator).
p2_renderer = "native"
shd_renderer = "p2"   # "p2" = рендер Prototype 2, "me" = Mass Effect NX
render_target_path_vulkan = "fsi"
user_language = 1

# Native renderer: the values Prototype 2 0.1.0 ships with (same engine).
p2_native_msaa = false
p2_native_record_thread = true
p2_native_async_pipelines = false
p2_native_pipeline_prewarm = true
p2_min_frame_vblanks = 1
p2_pace_before_present = false
p2_native_depth24 = true
gpu_specialize_texture_signs = true
p2_native_copy_specialization = true
p2_native_depth_words_direct = true
p2_native_structured_jumps = true
p2_native_edram_depth_alias_clear = true
p2_native_resolve_xenia_pack = true
p2_native_binding_revalidate = true
p2_native_dynamic_buffer_upload = true
p2_native_sampled_stable_ranges = true
p2_native_sampled_min_bytes = 16384
p2_native_max_anisotropy = 16
p2_native_texture_lod_bias = 0.0
p2_native_async_present = false
present_effect = "fsr"

# Threads and cores. The NSP forwarder allows cores 0-3, so the game gets the fourth core too (mask 15) and
# audio sits on core 3, as Prototype 2 does. Settings screen: "Четвёртое ядро" -> 7 = cores 0-2 only.
p2_msr_lock_mode = 2
p2_guest_priorities = false
p2_guest_affinity = false
p2_host_core_mask = 6
p2_main_thread_priority = 58
p2_main_thread_mask = 14
p2_guest_core_mask = 15
p2_audio_core_mask = 8

# Logs: warnings only.
log_level = "info"
log_flush_level = "info"
p2_frame_diagnostics = false
vulkan_validation_enabled = false
shd_native_alpha_probe = false

# Diagnostics for the splash / video question (no image change)
shd_diag_draw_targets = true
shd_diag_draw_sequence = 12000
shd_diag_draw_sequence_from = 300000
shd_diag_draw_sequence_every = 0

# Trace of draws (no image change)
p2_diag_draw_sequence = 0
p2_diag_draw_sequence_from = 0
p2_diag_texture_first_use = false
p2_native_exact_texture_check = true
p2_diag_dump_texture = 0
p2_diag_glyph_draws = false
p2_diag_frame_dump_seconds = 0
p2_native_capture_combo = false
gpu_stacked_layer_bias = -1.0
p2_diag_memexport = false
p2_diag_empty_textures = false
p2_diag_stale_textures = false
p2_native_exact_texture_changed_only = false
p2_native_max_mip_levels = 1
p2_diag_untile_levels = false
p2_native_recheck_empty_mips = false
