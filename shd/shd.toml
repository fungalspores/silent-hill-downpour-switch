# SILENT HILL: DOWNPOUR / Nintendo Switch - 0.3.0 (free, t.me/fspores)
# ReXGlue port; native Prototype 2 renderer. Recommended: 720x405 + sharp subtitles.
p2_renderer = "native"
shd_renderer = "p2"   # "p2" = рендер Prototype 2, "me" = старый Mass Effect NX
render_target_path_vulkan = "fsi"
user_language = 1

# Native renderer / release performance settings.
p2_native_msaa = false
p2_native_record_thread = true
p2_native_async_pipelines = false
p2_native_pipeline_prewarm = true
p2_min_frame_vblanks = 1
p2_pace_before_present = false
p2_native_depth24 = true
gpu_specialize_texture_signs = true
p2_native_copy_specialization = true
p2_native_depth_words_direct = true
p2_native_structured_jumps = true
p2_native_edram_depth_alias_clear = true
p2_native_resolve_xenia_pack = true
p2_native_binding_revalidate = true
p2_native_dynamic_buffer_upload = true
p2_native_sampled_stable_ranges = true
p2_native_sampled_min_bytes = 16384
p2_native_max_anisotropy = 16
p2_native_texture_lod_bias = 0.0
p2_native_async_present = false
present_effect = "fsr"

# Threads and cores; NSP/rex-start provides application mode and cores 0-3.
p2_msr_lock_mode = 2
p2_guest_priorities = false
p2_guest_affinity = false
p2_host_core_mask = 6
p2_main_thread_priority = 58
p2_main_thread_mask = 14
p2_guest_core_mask = 15
p2_audio_core_mask = 8

# Release logging and diagnostics: OFF. Do not enable capture/trace for normal play.
log_level = "warn"
log_flush_level = "warn"
shd_diag_scene_trace = false
shd_diag_scale = false
shd_scale_msaa = false
p2_diag_glyph_draws = false
p2_diag_frame_dump_seconds = 0
p2_diag_draw_sequence = 0
p2_diag_texture_first_use = false
p2_diag_memexport = false
p2_native_capture_combo = false
p2_native_resolve_probe = false
p2_native_trace_ps = ""
p2_native_trace_vs = ""

p2_native_exact_texture_check = true
gpu_stacked_layer_bias = -1.0
p2_native_exact_texture_changed_only = false
p2_native_max_mip_levels = 1
p2_native_recheck_empty_mips = false
p2_native_occlusion_queries = false

# Full target-pitch chain required for correct scaled rendering.
shd_scale_pitches = 15

# 3D resolution: 640x360, 720x405 (recommended), 800x450, 880x495,
# 960x540, 1040x585, 1120x630 or 1280x720. Change via rex-start (+); restart required.
shd_render_width = 720
shd_render_height = 405

# true (recommended): sharp Scaleform subtitles/UI at guest-native size after the first glyph
# of each frame; earlier 3D/post-process remains at shd_render_width. false = maximum FPS.
shd_ui_native = true
